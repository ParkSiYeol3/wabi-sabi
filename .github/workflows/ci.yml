name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 런타임 정렬: Vercel(package.json engines)·@types/node 와 동일한 24.x.
          # 타입이 런타임보다 앞서면 없는 API 가 타입검사를 통과할 수 있다(#230 교훈).
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # 프로드 의존성 high 이상 취약점이면 실패 (dev 의존성은 게이트 제외)
      - name: Audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
